<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Dictionnaire de l'Académie françoise, 1694 · Palavra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Spectral:wght@200;300;400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#EDE5D3; --papel-fundo:#E2D7C0; --tinta:#2A2622;
  --rubrica:#9B3E21; --regua:#C4B89E; --suave:#6E6155;
  --display:"EB Garamond",Georgia,serif;
  --corpo:"Spectral",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--papel-fundo);color:var(--tinta);font-family:var(--corpo);
  font-weight:300;-webkit-font-smoothing:antialiased}
.folha{max-width:1400px;margin:0 auto;padding:clamp(1.4rem,3.5vw,3rem) clamp(1rem,3.5vw,2.4rem) 4rem}

header{border-bottom:1px solid var(--regua);padding-bottom:1.3rem;margin-bottom:1.9rem;
  display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;flex-wrap:wrap}
.sobrescrito{font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--rubrica);margin:0 0 .8rem}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.55rem,3.6vw,2.5rem);
  line-height:1.1;margin:0 0 .4rem;font-style:italic}
.subtitulo{font-size:.97rem;font-weight:200;margin:0;max-width:54ch;color:#4A423A;line-height:1.55}
.idiomas{display:flex;gap:.15rem;flex-shrink:0}
.idiomas button{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;
  background:transparent;border:1px solid transparent;color:var(--suave);padding:.3rem .5rem;cursor:pointer}
.idiomas button:hover{color:var(--rubrica)}
.idiomas button[aria-pressed="true"]{border-color:var(--regua);color:var(--tinta)}

.leitor{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);
  gap:clamp(1rem,2.5vw,2.2rem);align-items:start}

.corte{position:sticky;top:1.4rem}
.corte-titulo{font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;
  color:#8A7F70;margin:0 0 .8rem}
.grupo{margin-bottom:.7rem}
.grupo-nome{font-family:var(--mono);font-size:.61rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--suave);margin:0 0 .28rem;display:flex;justify-content:space-between;gap:.4rem}
.grupo-nome span{color:#A79A88}
.pilha{display:flex;flex-direction:column;gap:2px}
.lamina{appearance:none;border:0;padding:0;margin:0;background:transparent;cursor:pointer;
  height:9px;width:100%;position:relative}
.lamina::before{content:"";position:absolute;left:0;top:4px;height:1px;width:60%;
  background:var(--regua);transition:width .2s ease,background .2s ease}
.lamina:hover::before{width:88%;background:#8C8171}
.lamina[aria-current="true"]::before{width:100%;height:2px;top:3.5px;background:var(--rubrica)}
.lamina:focus-visible{outline:2px solid var(--rubrica);outline-offset:2px}

.moldura{position:relative;perspective:2200px;aspect-ratio:872/1345;width:100%}
.camada{position:absolute;inset:0;transform-style:preserve-3d}
.camada img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;
  backface-visibility:hidden;box-shadow:0 1px 2px rgba(42,38,34,.14),0 14px 34px -14px rgba(42,38,34,.42)}
.camada.vira{transform-origin:left center;z-index:3}
.verso{position:absolute;inset:0;background:var(--papel);transform:rotateY(180deg);
  backface-visibility:hidden;box-shadow:0 1px 2px rgba(42,38,34,.14),0 14px 34px -14px rgba(42,38,34,.42)}
.sombra{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(42,38,34,.34),rgba(42,38,34,0) 62%)}
.zona{position:absolute;top:0;bottom:0;width:50%;border:0;background:transparent;cursor:pointer;z-index:4}
.zona.ant{left:0;cursor:w-resize} .zona.prox{right:0;cursor:e-resize}
.zona:focus-visible{outline:2px solid var(--rubrica);outline-offset:-4px}

.barra{display:flex;align-items:center;gap:.9rem;justify-content:center;margin:1.1rem 0 0}
.passo{font-family:var(--mono);font-size:1rem;line-height:1;border:1px solid var(--regua);
  background:transparent;color:var(--tinta);width:2rem;height:2rem;border-radius:50%;cursor:pointer}
.passo:hover:not(:disabled){border-color:var(--rubrica);color:var(--rubrica)}
.passo:disabled{opacity:.3;cursor:default}
.contador{font-family:var(--mono);font-size:.67rem;letter-spacing:.13em;color:#8A7F70;min-width:7rem;text-align:center}
.gallica{display:block;text-align:center;margin-top:.7rem;font-family:var(--mono);font-size:.62rem;
  letter-spacing:.1em;color:var(--suave);text-decoration:none}
.gallica:hover{color:var(--rubrica)}

.painel{position:sticky;top:1.4rem;border-left:1px solid var(--regua);padding-left:clamp(1rem,2vw,1.8rem);
  max-height:calc(100vh - 3rem);overflow-y:auto}
.painel-topo{font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;
  color:#8A7F70;margin:0 0 .8rem}
.painel h2{font-family:var(--display);font-weight:500;font-size:1.3rem;margin:0 0 .45rem}
.painel .nota-vista{font-size:.88rem;font-weight:200;line-height:1.6;color:#4A423A;
  margin:0 0 1.3rem;padding-bottom:1.1rem;border-bottom:1px solid var(--regua)}
.texto{font-size:.95rem;line-height:1.72;white-space:pre-wrap;margin:0 0 1.4rem}
.texto.vazio{font-style:italic;color:var(--suave);font-size:.88rem}
.rodape-texto{font-size:.74rem;font-weight:200;line-height:1.6;color:var(--suave);
  border-top:1px solid var(--regua);padding-top:.9rem}
.rodape-texto p{margin:0 0 .5rem} .rodape-texto p:last-child{margin:0}
.rodape-texto a{color:var(--rubrica)}

.aviso{margin:1.2rem 0 0;padding:.9rem 1.05rem;border:1px solid var(--rubrica);border-left-width:3px;
  background:rgba(155,62,33,.05);font-size:.84rem;font-weight:200;line-height:1.6}
.aviso code{font-family:var(--mono);font-size:.85em;background:rgba(42,38,34,.07);padding:.1em .3em}
.nota{border-top:1px solid var(--regua);margin-top:3rem;padding-top:1.2rem;
  font-size:.78rem;font-weight:200;line-height:1.65;color:var(--suave);max-width:70ch}
.nota strong{font-weight:400;color:var(--tinta)}

@media (max-width:1080px){
  .leitor{grid-template-columns:130px minmax(0,1fr)}
  .painel{grid-column:1 / -1;position:static;border-left:0;padding-left:0;
    border-top:1px solid var(--regua);padding-top:1.4rem;margin-top:1.5rem;max-height:none}
}
@media (max-width:720px){
  .leitor{grid-template-columns:1fr}
  .corte{position:static;order:3;border-top:1px solid var(--regua);padding-top:1.1rem;margin-top:1.5rem}
  .corte-interno{display:flex;gap:1rem;overflow-x:auto;padding-bottom:.4rem}
  .grupo{margin-bottom:0;min-width:78px;flex:0 0 auto}
  .pilha{flex-direction:row;gap:3px;height:16px;align-items:center}
  .lamina{height:16px;width:5px}
  .lamina::before{top:0;left:2px;width:1px;height:60%}
  .lamina[aria-current="true"]::before{width:2px;height:100%;left:1.5px;top:0}
  .painel{order:2;margin-top:1.4rem}
}
@media (prefers-reduced-motion:reduce){.camada.vira{transition:none!important}}
</style>
</head>
<body>
<div class="folha">

  <header>
    <div>
      <p class="sobrescrito" id="t-sobrescrito"></p>
      <h1 id="t-titulo"></h1>
      <p class="subtitulo" id="t-subtitulo"></p>
    </div>
    <nav class="idiomas" id="idiomas" aria-label="Language"></nav>
  </header>

  <div class="leitor">

    <nav class="corte" aria-label="Navigation">
      <p class="corte-titulo" id="t-corte"></p>
      <div class="corte-interno" id="corte"></div>
    </nav>

    <div class="palco">
      <div class="moldura" id="moldura">
        <div class="camada"><img id="img-base" alt=""></div>
        <div class="camada vira" id="vira" hidden>
          <img id="img-vira" alt=""><div class="verso"></div>
        </div>
        <div class="sombra" id="sombra"></div>
        <button class="zona ant" id="zona-ant"></button>
        <button class="zona prox" id="zona-prox"></button>
      </div>
      <div class="barra">
        <button class="passo" id="btn-ant">‹</button>
        <span class="contador" id="contador"></span>
        <button class="passo" id="btn-prox">›</button>
      </div>
      <a class="gallica" id="gallica" href="#" target="_blank" rel="noopener"></a>
      <div class="aviso" id="aviso" hidden></div>
    </div>

    <aside class="painel">
      <p class="painel-topo" id="t-painel"></p>
      <h2 id="rotulo"></h2>
      <p class="nota-vista" id="nota-vista"></p>
      <div class="texto" id="texto" aria-live="polite"></div>
      <div class="rodape-texto" id="rodape-texto"></div>
    </aside>

  </div>

  <p class="nota" id="t-tratamento"></p>
  <p class="nota" id="t-fonte"></p>

</div>

<script>
(function(){
  "use strict";
  var D = null, LG = "en", vistas = [], secoes = [], atual = 0, animando = false;
  var EMB = window.__PAGINAS_EMBUTIDAS__ || null;
  var laminas = {};
  var semMov = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var el = function(id){ return document.getElementById(id); };
  var elBase = el("img-base"), elVira = el("img-vira"), camVira = el("vira"), elSombra = el("sombra");

  function src(v){ var n = String(v).padStart(2,"0"); return EMB ? EMB[n] : "paginas/" + n + ".webp"; }

  function idiomaInicial(){
    var q = new URLSearchParams(location.search).get("lang");
    if (q && D.idiomas.indexOf(q) > -1) return q;
    var nav = (navigator.languages || [navigator.language || ""]);
    for (var i = 0; i < nav.length; i++){
      var c = String(nav[i]).slice(0,2).toLowerCase();
      if (D.idiomas.indexOf(c) > -1) return c;
    }
    return D.padrao;
  }

  function montarIdiomas(){
    var nomes = { fr:"Français", pt:"Português", es:"Español", en:"English" };
    var nav = el("idiomas");
    nav.innerHTML = "";
    D.idiomas.forEach(function(lg){
      var b = document.createElement("button");
      b.type = "button"; b.textContent = lg; b.title = nomes[lg] || lg;
      b.setAttribute("aria-pressed", String(lg === LG));
      b.addEventListener("click", function(){ trocarIdioma(lg); });
      nav.appendChild(b);
    });
  }

  function montarCorte(){
    var c = el("corte"); c.innerHTML = ""; laminas = {};
    secoes.forEach(function(s){
      var g = document.createElement("div"); g.className = "grupo";
      var ini = s.vistas[0], fim = s.vistas[1];
      var h = document.createElement("p"); h.className = "grupo-nome";
      h.innerHTML = "<em></em><span></span>";
      h.firstChild.textContent = s[LG]; h.lastChild.textContent = (fim - ini + 1);
      g.appendChild(h);
      var pilha = document.createElement("div"); pilha.className = "pilha";
      for (var v = ini; v <= fim; v++){
        (function(v){
          var b = document.createElement("button");
          b.className = "lamina"; b.type = "button";
          b.setAttribute("aria-label", "" + v);
          b.addEventListener("click", function(){ irPara(indiceDe(v)); });
          laminas[v] = b; pilha.appendChild(b);
        })(v);
      }
      g.appendChild(pilha); c.appendChild(g);
    });
  }

  function indiceDe(v){ for (var i=0;i<vistas.length;i++) if (vistas[i].vista===v) return i; return 0; }

  function trocarIdioma(lg){
    LG = lg; document.documentElement.lang = lg;
    var u = D.ui[lg];
    el("t-sobrescrito").textContent = u.sobrescrito;
    el("t-titulo").textContent = u.titulo;
    el("t-subtitulo").textContent = u.subtitulo;
    el("t-corte").textContent = u.corte;
    el("t-painel").textContent = u.painel;
    el("t-tratamento").textContent = u.nota_tratamento;
    el("t-fonte").textContent = u.nota_fonte + ". " + u.nota_fonte_texto;
    el("btn-ant").setAttribute("aria-label", u.anterior);
    el("btn-prox").setAttribute("aria-label", u.proxima);
    el("zona-ant").setAttribute("aria-label", u.anterior);
    el("zona-prox").setAttribute("aria-label", u.proxima);
    Array.prototype.forEach.call(el("idiomas").children, function(b){
      b.setAttribute("aria-pressed", String(b.textContent === lg));
    });
    montarCorte(); pintar(atual);
    var url = new URL(location); url.searchParams.set("lang", lg);
    history.replaceState(null, "", url);
  }

  function pintar(i){
    var v = vistas[i], u = D.ui[LG], c = v[LG];
    elBase.src = src(v.vista);
    elBase.alt = c.rotulo;
    el("contador").textContent = u.vista + " " + String(v.vista).padStart(2,"0") + " " + u.de + " " + vistas.length;
    el("rotulo").textContent = c.rotulo;
    el("nota-vista").textContent = c.nota || "";
    el("nota-vista").style.display = c.nota ? "" : "none";

    var t = el("texto"), r = el("rodape-texto");
    if (c.texto){
      t.className = "texto"; t.textContent = c.texto;
    } else {
      t.className = "texto vazio";
      t.textContent = v.estado === "sem_texto" ? u.estado_sem_texto
        : (LG === "fr" ? u.estado_pendente : u.traducao_pendente);
    }

    var linhas = [];
    if (c.texto){
      if (LG === "fr" && u.nota_transcricao) linhas.push(u.nota_transcricao);
      if (LG !== "fr" && u.nota_traducao)   linhas.push(u.nota_traducao);
    }
    if (v.estado === "parcial") linhas.push(u.estado_parcial);
    if (v.fonte_texto && v.fonte_texto.credito){
      linhas.push(u.fonte_rotulo + " : " + v.fonte_texto.credito);
    }
    r.innerHTML = "";
    linhas.forEach(function(x){ var p = document.createElement("p"); p.textContent = x; r.appendChild(p); });
    r.style.display = linhas.length ? "" : "none";

    var g = el("gallica");
    g.href = D.gallica.base + (v.vista + D.gallica.deslocamento) + ".item";
    g.textContent = u.gallica_link;

    for (var k in laminas) laminas[k].setAttribute("aria-current","false");
    if (laminas[v.vista]) laminas[v.vista].setAttribute("aria-current","true");
    el("btn-ant").disabled = (i === 0);
    el("btn-prox").disabled = (i === vistas.length - 1);

    [i-1,i+1,i+2].forEach(function(j){
      if (j>=0 && j<vistas.length){ var im=new Image(); im.src=src(vistas[j].vista); }
    });
  }

  function irPara(dest){
    if (animando || dest === atual || dest < 0 || dest >= vistas.length) return;
    var adiante = dest > atual;
    if (semMov){ atual = dest; pintar(atual); return; }
    animando = true;
    elVira.src = src(vistas[adiante ? atual : dest].vista);
    elBase.src = src(vistas[adiante ? dest : atual].vista);
    camVira.hidden = false;
    camVira.style.transition = "none";
    camVira.style.transform = adiante ? "rotateY(0deg)" : "rotateY(-178deg)";
    elSombra.style.transition = "none";
    elSombra.style.opacity = adiante ? "0" : "1";
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      camVira.style.transition = "transform .6s cubic-bezier(.42,.02,.34,1)";
      elSombra.style.transition = "opacity .6s ease";
      camVira.style.transform = adiante ? "rotateY(-178deg)" : "rotateY(0deg)";
      elSombra.style.opacity = adiante ? "1" : "0";
    });});
    setTimeout(function(){
      atual = dest; pintar(atual);
      camVira.hidden = true;
      elSombra.style.transition = "none"; elSombra.style.opacity = "0";
      animando = false;
    }, 620);
  }

  function ligarControles(){
    var prox = function(){ irPara(atual+1); }, ant = function(){ irPara(atual-1); };
    el("btn-prox").addEventListener("click", prox);
    el("btn-ant").addEventListener("click", ant);
    el("zona-prox").addEventListener("click", prox);
    el("zona-ant").addEventListener("click", ant);
    document.addEventListener("keydown", function(e){
      if (/^(input|textarea)$/i.test(e.target.tagName)) return;
      if (e.key === "ArrowRight"){ e.preventDefault(); prox(); }
      if (e.key === "ArrowLeft"){ e.preventDefault(); ant(); }
      if (e.key === "Home"){ e.preventDefault(); irPara(0); }
      if (e.key === "End"){ e.preventDefault(); irPara(vistas.length-1); }
    });
    var x0 = null, m = el("moldura");
    m.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; }, {passive:true});
    m.addEventListener("touchend", function(e){
      if (x0 === null) return;
      var d = e.changedTouches[0].clientX - x0;
      if (Math.abs(d) > 44){ d < 0 ? prox() : ant(); }
      x0 = null;
    }, {passive:true});
    elBase.addEventListener("error", function(){
      if (EMB) return;
      var a = el("aviso"); a.hidden = false;
      var u = D.ui[LG];
      a.innerHTML = "";
      var p = document.createElement("p");
      p.textContent = u.erro_imagens + " ";
      var code = document.createElement("code");
      code.textContent = elBase.getAttribute("src");
      p.appendChild(code);
      a.appendChild(p);
      var p2 = document.createElement("p");
      p2.textContent = u.erro_imagens_2;
      a.appendChild(p2);
    });
  }

  function iniciar(dados){
    D = dados; vistas = D.vistas; secoes = D.secoes;
    LG = idiomaInicial();
    montarIdiomas(); ligarControles(); trocarIdioma(LG);
  }

  if (window.__TEXTOS__){ iniciar(window.__TEXTOS__); }
  else {
    fetch("textos.json").then(function(r){
      if (!r.ok) throw new Error(r.status); return r.json();
    }).then(iniciar).catch(function(){
      document.querySelector(".folha").innerHTML =
        '<p style="font-family:var(--mono);font-size:.85rem;color:#9B3E21;padding:2rem">' +
        'textos.json could not be loaded. This page must be served over a web server ' +
        '(e.g. <code>python -m http.server 8000</code>), not opened directly from disk.</p>';
    });
  }
})();
</script>
</body>
</html>
